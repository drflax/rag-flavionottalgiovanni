<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>RAG Flavio Nottalgiovanni Sambucetti</title>
  <link rel="preload" as="style" href="style.css" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="shell">
    <div class="brand">
      <span class="mark">RAG</span> <span class="name">Flavio Nottalgiovanni Sambucetti</span>
      <span class="tag">datos profesionales desde flavio.md</span>
    </div>
  </header>

  <main class="shell">
    <!--<aside class="panel" id="panelData">
      <h2>Fuente de datos</h2>
      <div class="muted" id="dataEmpty">Cargando flavio.md…</div>
      <div class="file-list" id="fileList"></div>
      <div class="stats" id="stats">
        <div class="stat"><strong id="statDocs">0</strong><span>secciones</span></div>
        <div class="stat"><strong id="statTerms">0</strong><span>términos únicos</span></div>
      </div>
    </aside>-->

    <section class="chat">
      <div class="messages" id="messages">
        <div class="msg msg-bot">
          <div class="bubble">Cargando datos de Flavio Nottalgiovanni Sambucetti desde flavio.md…</div>
        </div>
      </div>

      <form class="composer" id="composer" novalidate>
        <label class="sr-only" for="question">Tu pregunta</label>
        <input
          type="text"
          id="question"
          placeholder="Pregúntame sobre Flavio (empresas, habilidades, educación, experiencia…)…"
          autocomplete="off"
          required
        />
        <button type="submit" id="btnAsk">Preguntar</button>
      </form>
      <div class="hint" id="hint"></div>
    </section>
  </main>

  <footer class="shell muted small">
    RAG con archivo Markdown. Los datos se leen de <code>flavio.md</code> y el índice se construye en el navegador. Workers AI genera respuestas si está disponible.
  </footer>

  <template id="tplMsg">
    <div class="msg"><div class="bubble"></div></div>
  </template>

  <script src="app.js"></script>
</body>
</html>
